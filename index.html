<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>생기부 탐구 주제 추천</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card-bg: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --primary: #3457d5;
    --primary-light: #e8edff;
    --border: #e5e7eb;
    --tag-bg: #eef2ff;
    --tag-text: #3457d5;
    --radius: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .site-header {
    background: linear-gradient(135deg, #3457d5, #5b7cfa);
    color: #fff;
    padding: 40px 0 32px;
  }

  .site-header h1 {
    margin: 0 0 8px;
    font-size: 28px;
  }

  .site-header .subtitle {
    margin: 0;
    font-size: 15px;
    opacity: 0.92;
  }

  main.wrap {
    padding-top: 28px;
    padding-bottom: 60px;
    min-height: 50vh;
  }

  .filter-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .field-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }

  .field-tab {
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--muted);
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .field-tab:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .field-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .grade-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .grade-tab {
    flex: 1;
    padding: 12px 0;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--muted);
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .grade-tab:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .grade-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .grade-tab.drop-target {
    outline: 2px dashed #fff;
    outline-offset: -4px;
    background: #24408f;
    border-color: #24408f;
    color: #fff;
  }

  .drag-hint {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 20px;
  }

  .subject-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }

  .subject-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 14px;
    text-align: left;
    cursor: grab;
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, opacity 0.12s ease;
  }

  .subject-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(52, 87, 213, 0.12);
    border-color: var(--primary);
  }

  .subject-card.dragging {
    opacity: 0.35;
  }

  .subject-card.drag-over {
    outline: 2px dashed var(--primary);
    outline-offset: 2px;
  }

  .subject-card .subject-category {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: var(--primary);
    background: var(--primary-light);
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 8px;
  }

  .subject-card .subject-name {
    display: block;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .subject-card .subject-meta {
    font-size: 12px;
    color: var(--muted);
  }

  .subject-card.ready .subject-meta {
    color: var(--primary);
    font-weight: 600;
  }

  .topic-panel {
    margin-top: 28px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .topic-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .topic-panel-head h2 {
    margin: 0;
    font-size: 20px;
  }

  .close-btn {
    background: none;
    border: none;
    font-size: 18px;
    color: var(--muted);
    cursor: pointer;
    padding: 4px 8px;
  }

  .close-btn:hover { color: var(--text); }

  .topic-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .topic-card {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    padding-right: 40px;
  }

  .topic-card.custom {
    border-color: var(--primary);
    background: var(--primary-light);
  }

  .topic-card .topic-title {
    font-size: 15.5px;
    font-weight: 700;
    margin: 0 0 6px;
  }

  .topic-card .topic-desc {
    margin: 0 0 10px;
    color: #3a3f4b;
    font-size: 14px;
  }

  .topic-delete {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 4px;
  }

  .topic-delete:hover { color: #d9455f; }

  .tag {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--tag-text);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    margin-right: 6px;
  }

  .empty-state {
    color: var(--muted);
    font-size: 14px;
    padding: 20px 4px;
  }

  .add-topic-btn {
    border: 1px dashed var(--border);
    background: none;
    color: var(--primary);
    font-size: 14px;
    font-weight: 600;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
  }

  .add-topic-btn:hover {
    border-color: var(--primary);
    background: var(--primary-light);
  }

  .add-topic-form {
    border: 1px dashed var(--primary);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .add-topic-form label.field-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }

  .add-topic-form input[type="text"],
  .add-topic-form textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    background: var(--card-bg);
    color: var(--text);
  }

  .add-topic-form textarea {
    resize: vertical;
    min-height: 54px;
  }

  .field-checkboxes {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .field-checkboxes label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    background: var(--tag-bg);
    color: var(--tag-text);
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
  }

  .form-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 4px;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13.5px;
  }

  .btn-secondary {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
  }

  .site-footer {
    border-top: 1px solid var(--border);
    padding: 20px 0 40px;
    color: var(--muted);
    font-size: 13px;
  }

  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }

  .reset-btn:hover {
    border-color: #d9455f;
    color: #d9455f;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c;
      --card-bg: #1c1f27;
      --text: #eef0f4;
      --muted: #9aa1ae;
      --border: #2b2f3a;
      --primary-light: #232a45;
      --tag-bg: #232a45;
      --tag-text: #93a6ff;
    }
  }
</style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>생기부 주제 도우미</h1>
      <p class="subtitle">2022 개정 교육과정 기준 · 진로 분야와 학년, 과목을 선택하면 세특·탐구활동 기초자료로 참고할 주제를 확인할 수 있어요.</p>
    </div>
  </header>

  <main class="wrap">
    <div class="filter-label">진로 분야</div>
    <nav class="field-tabs" id="fieldTabs"></nav>

    <div class="filter-label">학년</div>
    <nav class="grade-tabs" id="gradeTabs">
      <button class="grade-tab active" data-grade="1">1학년</button>
      <button class="grade-tab" data-grade="2">2학년</button>
      <button class="grade-tab" data-grade="3">3학년</button>
    </nav>
    <p class="drag-hint">과목 카드를 위 학년 탭으로 끌어다 놓으면 다른 학년으로 옮길 수 있고, 같은 화면 안에서 끌면 순서도 바꿀 수 있어요. (학교 교육과정에 맞게 자유롭게 편집하세요)</p>

    <section class="subject-grid" id="subjectGrid" aria-live="polite"></section>

    <section class="topic-panel" id="topicPanel" hidden>
      <div class="topic-panel-head">
        <h2 id="topicSubjectName"></h2>
        <button class="close-btn" id="closePanel" aria-label="닫기">✕</button>
      </div>
      <div class="topic-list" id="topicList"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <p>※ 위 주제는 참고용 예시이며, 직접 추가한 주제와 과목 배치는 이 브라우저에 저장됩니다.</p>
      <button class="reset-btn" id="resetBtn" type="button">기본값으로 초기화</button>
    </div>
  </footer>

  var STORAGE_KEY = "saengibu_topic_data_v1";

  function genId(prefix) {
    return prefix + "_" + Date.now().toString(36) + "_" + Math.floor(Math.random() * 100000).toString(36);
  }

  function ensureIds(data) {
    Object.keys(data).forEach(function (grade) {
      data[grade].forEach(function (subject) {
        if (!subject.id) subject.id = genId("subj");
        subject.topics.forEach(function (topic) {
          if (!topic.id) topic.id = genId("topic");
        });
      });
    });
    return data;
  }

  function loadData() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
    } catch (e) {
      // 저장된 데이터를 읽을 수 없으면 기본값 사용
    }
    var fresh = ensureIds(JSON.parse(JSON.stringify(DEFAULT_DATA)));
    persist(fresh);
    return fresh;
  }

  function persist(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      // 저장 공간이 없거나 접근 불가 시 조용히 무시
    }
  }

  var DATA = loadData();

  function saveData() {
    persist(DATA);
  }

  var fieldTabs = document.getElementById("fieldTabs");
  var gradeTabs = document.getElementById("gradeTabs");
  var subjectGrid = document.getElementById("subjectGrid");
  var topicPanel = document.getElementById("topicPanel");
  var topicSubjectName = document.getElementById("topicSubjectName");
  var topicList = document.getElementById("topicList");
  var closePanel = document.getElementById("closePanel");
  var resetBtn = document.getElementById("resetBtn");

  var currentGrade = 1;
  var currentField = "전체";
  var openSubjectId = null;
  var addFormOpen = false;

  var draggedSubjectId = null;
  var draggedFromGrade = null;

  function findSubjectById(id) {
    for (var g = 1; g <= 3; g++) {
      for (var i = 0; i < DATA[g].length; i++) {
        if (DATA[g][i].id === id) return DATA[g][i];
      }
    }
    return null;
  }

  function renderFieldTabs() {
    fieldTabs.innerHTML = "";
    var all = ["전체"].concat(FIELDS);
    for (var i = 0; i < all.length; i++) {
      var field = all[i];
      var btn = document.createElement("button");
      btn.className = "field-tab" + (field === currentField ? " active" : "");
      btn.setAttribute("data-field", field);
      btn.textContent = field;
      fieldTabs.appendChild(btn);
    }
  }

  function topicMatchesField(topic) {
    return currentField === "전체" || (topic.fields && topic.fields.indexOf(currentField) !== -1);
  }

  function visibleTopicsOf(subject) {
    return subject.topics.filter(topicMatchesField);
  }

  function renderSubjects(grade) {
    subjectGrid.innerHTML = "";
    var subjects = DATA[grade];
    for (var i = 0; i < subjects.length; i++) {
      var subject = subjects[i];
      var visible = visibleTopicsOf(subject);
      var btn = document.createElement("button");
      btn.className = "subject-card" + (visible.length ? " ready" : "");
      btn.setAttribute("draggable", "true");
      btn.setAttribute("data-subject-id", subject.id);
      btn.setAttribute("data-grade", grade);

      var meta;
      if (subject.topics.length === 0) {
        meta = "준비중";
      } else if (visible.length === 0) {
        meta = "해당 분야 없음";
      } else {
        meta = visible.length + "개 주제";
      }

      btn.innerHTML =
        '<span class="subject-category">' + subject.category + '</span>' +
        '<span class="subject-name">' + subject.name + '</span>' +
        '<span class="subject-meta">' + meta + '</span>';

      (function (s) {
        btn.addEventListener("click", function () {
          openTopics(s);
        });
      })(subject);

      subjectGrid.appendChild(btn);
    }
  }

  function renderTopicPanel() {
    var subject = findSubjectById(openSubjectId);
    if (!subject) {
      topicPanel.hidden = true;
      return;
    }

    topicSubjectName.textContent = subject.name + " (" + subject.category + ")";
    topicList.innerHTML = "";

    var visible = visibleTopicsOf(subject);

    if (subject.topics.length === 0) {
      var p1 = document.createElement("p");
      p1.className = "empty-state";
      p1.textContent = "이 과목의 주제 자료가 아직 없습니다. 아래에서 직접 추가해 보세요.";
      topicList.appendChild(p1);
    } else if (visible.length === 0) {
      var p2 = document.createElement("p");
      p2.className = "empty-state";
      p2.textContent = "선택한 진로 분야(" + currentField + ")에 해당하는 주제가 아직 없습니다. 다른 분야를 선택하거나 새 주제를 추가해 보세요.";
      topicList.appendChild(p2);
    } else {
      visible.forEach(function (topic) {
        var card = document.createElement("div");
        card.className = "topic-card" + (topic.custom ? " custom" : "");

        var title = document.createElement("p");
        title.className = "topic-title";
        title.textContent = topic.title;
        card.appendChild(title);

        if (topic.desc) {
          var desc = document.createElement("p");
          desc.className = "topic-desc";
          desc.textContent = topic.desc;
          card.appendChild(desc);
        }

        var tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = topic.tag || "직접 추가";
        card.appendChild(tag);

        if (topic.custom) {
          var customTag = document.createElement("span");
          customTag.className = "tag";
          customTag.textContent = "내가 추가함";
          card.appendChild(customTag);
        }

        var del = document.createElement("button");
        del.className = "topic-delete";
        del.setAttribute("aria-label", "주제 삭제");
        del.textContent = "✕";
        del.addEventListener("click", function () {
          if (!confirm('"' + topic.title + '" 주제를 삭제할까요?')) return;
          var idx = subject.topics.findIndex(function (t) { return t.id === topic.id; });
          if (idx !== -1) subject.topics.splice(idx, 1);
          saveData();
          renderTopicPanel();
          renderSubjects(currentGrade);
        });
        card.appendChild(del);

        topicList.appendChild(card);
      });
    }

    renderAddTopicArea(subject);

    topicPanel.hidden = false;
  }

  function renderAddTopicArea(subject) {
    if (!addFormOpen) {
      var addBtn = document.createElement("button");
      addBtn.className = "add-topic-btn";
      addBtn.type = "button";
      addBtn.textContent = "+ 주제 직접 추가하기";
      addBtn.addEventListener("click", function () {
        addFormOpen = true;
        renderTopicPanel();
      });
      topicList.appendChild(addBtn);
      return;
    }

    var form = document.createElement("div");
    form.className = "add-topic-form";

    var titleLabel = document.createElement("label");
    titleLabel.className = "field-label";
    titleLabel.textContent = "주제 제목 *";
    var titleInput = document.createElement("input");
    titleInput.type = "text";
    titleInput.placeholder = "예: 우리 학교 급식 데이터 분석";

    var descLabel = document.createElement("label");
    descLabel.className = "field-label";
    descLabel.textContent = "간단한 설명 (선택)";
    var descInput = document.createElement("textarea");
    descInput.placeholder = "어떤 활동을 하는 주제인지 간단히 적어주세요.";

    var tagLabel = document.createElement("label");
    tagLabel.className = "field-label";
    tagLabel.textContent = "활동 태그 (선택)";
    var tagInput = document.createElement("input");
    tagInput.type = "text";
    tagInput.placeholder = "예: 탐구활동, 독서연계, 프로젝트 등";

    var fieldsLabel = document.createElement("label");
    fieldsLabel.className = "field-label";
    fieldsLabel.textContent = "관련 진로 분야 (선택, 여러 개 가능)";
    var fieldsBox = document.createElement("div");
    fieldsBox.className = "field-checkboxes";
    var checkboxes = FIELDS.map(function (field) {
      var label = document.createElement("label");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.value = field;
      label.appendChild(cb);
      label.appendChild(document.createTextNode(field));
      fieldsBox.appendChild(label);
      return cb;
    });

    var actions = document.createElement("div");
    actions.className = "form-actions";

    var cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "btn-secondary";
    cancelBtn.textContent = "취소";
    cancelBtn.addEventListener("click", function () {
      addFormOpen = false;
      renderTopicPanel();
    });

    var saveBtn = document.createElement("button");
    saveBtn.type = "button";
    saveBtn.className = "btn-primary";
    saveBtn.textContent = "추가하기";
    saveBtn.addEventListener("click", function () {
      var titleVal = titleInput.value.trim();
      if (!titleVal) {
        titleInput.focus();
        return;
      }
      var selectedFields = checkboxes.filter(function (cb) { return cb.checked; }).map(function (cb) { return cb.value; });
      subject.topics.push({
        id: genId("topic"),
        title: titleVal,
        desc: descInput.value.trim(),
        tag: tagInput.value.trim() || "직접 추가",
        fields: selectedFields,
        custom: true
      });
      saveData();
      addFormOpen = false;
      currentField = "전체";
      renderFieldTabs();
      renderTopicPanel();
      renderSubjects(currentGrade);
    });

    actions.appendChild(cancelBtn);
    actions.appendChild(saveBtn);

    form.appendChild(titleLabel);
    form.appendChild(titleInput);
    form.appendChild(descLabel);
    form.appendChild(descInput);
    form.appendChild(tagLabel);
    form.appendChild(tagInput);
    form.appendChild(fieldsLabel);
    form.appendChild(fieldsBox);
    form.appendChild(actions);

    topicList.appendChild(form);
    titleInput.focus();
  }

  function openTopics(subject) {
    openSubjectId = subject.id;
    addFormOpen = false;
    renderTopicPanel();
    topicPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  // ---- 진로 분야 / 학년 탭 ----

  fieldTabs.addEventListener("click", function (e) {
    var tab = e.target.closest(".field-tab");
    if (!tab) return;
    currentField = tab.getAttribute("data-field");
    var allTabs = document.querySelectorAll(".field-tab");
    for (var i = 0; i < allTabs.length; i++) allTabs[i].classList.remove("active");
    tab.classList.add("active");
    topicPanel.hidden = true;
    renderSubjects(currentGrade);
  });

  gradeTabs.addEventListener("click", function (e) {
    var tab = e.target.closest(".grade-tab");
    if (!tab || draggedSubjectId) return;
    currentGrade = Number(tab.getAttribute("data-grade"));
    var allTabs = document.querySelectorAll(".grade-tab");
    for (var i = 0; i < allTabs.length; i++) allTabs[i].classList.remove("active");
    tab.classList.add("active");
    topicPanel.hidden = true;
    renderSubjects(currentGrade);
  });

  closePanel.addEventListener("click", function () {
    topicPanel.hidden = true;
  });

  resetBtn.addEventListener("click", function () {
    if (!confirm("직접 추가한 주제와 과목 배치가 모두 사라지고 기본값으로 되돌아갑니다. 계속할까요?")) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    location.reload();
  });

  // ---- 과목 카드 드래그 앤 드롭 ----

  subjectGrid.addEventListener("dragstart", function (e) {
    var card = e.target.closest(".subject-card");
    if (!card) return;
    draggedSubjectId = card.getAttribute("data-subject-id");
    draggedFromGrade = Number(card.getAttribute("data-grade"));
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", draggedSubjectId);
    }
    card.classList.add("dragging");
  });

  subjectGrid.addEventListener("dragend", function (e) {
    var card = e.target.closest(".subject-card");
    if (card) card.classList.remove("dragging");
    document.querySelectorAll(".subject-card.drag-over").forEach(function (c) { c.classList.remove("drag-over"); });
    document.querySelectorAll(".grade-tab.drop-target").forEach(function (t) { t.classList.remove("drop-target"); });
    draggedSubjectId = null;
    draggedFromGrade = null;
  });

  subjectGrid.addEventListener("dragover", function (e) {
    if (!draggedSubjectId) return;
    e.preventDefault();
    var card = e.target.closest(".subject-card");
    document.querySelectorAll(".subject-card.drag-over").forEach(function (c) { c.classList.remove("drag-over"); });
    if (card && card.getAttribute("data-subject-id") !== draggedSubjectId) {
      card.classList.add("drag-over");
    }
  });

  subjectGrid.addEventListener("drop", function (e) {
    if (!draggedSubjectId) return;
    e.preventDefault();
    document.querySelectorAll(".subject-card.drag-over").forEach(function (c) { c.classList.remove("drag-over"); });

    if (draggedFromGrade !== currentGrade) return;

    var arr = DATA[currentGrade];
    var fromIndex = arr.findIndex(function (s) { return s.id === draggedSubjectId; });
    if (fromIndex === -1) return;

    var card = e.target.closest(".subject-card");
    var toIndex = card ? arr.findIndex(function (s) { return s.id === card.getAttribute("data-subject-id"); }) : arr.length - 1;
    if (toIndex === -1 || toIndex === fromIndex) return;

    var moved = arr.splice(fromIndex, 1)[0];
    if (toIndex > fromIndex) toIndex--;
    arr.splice(toIndex, 0, moved);

    saveData();
    renderSubjects(currentGrade);
  });

  gradeTabs.addEventListener("dragover", function (e) {
    var tab = e.target.closest(".grade-tab");
    if (!tab || !draggedSubjectId) return;
    e.preventDefault();
    document.querySelectorAll(".grade-tab.drop-target").forEach(function (t) { t.classList.remove("drop-target"); });
    tab.classList.add("drop-target");
  });

  gradeTabs.addEventListener("dragleave", function (e) {
    var tab = e.target.closest(".grade-tab");
    if (tab) tab.classList.remove("drop-target");
  });

  gradeTabs.addEventListener("drop", function (e) {
    var tab = e.target.closest(".grade-tab");
    if (!tab || !draggedSubjectId) return;
    e.preventDefault();
    tab.classList.remove("drop-target");

    var targetGrade = Number(tab.getAttribute("data-grade"));
    if (targetGrade === draggedFromGrade) return;

    var fromArr = DATA[draggedFromGrade];
    var idx = fromArr.findIndex(function (s) { return s.id === draggedSubjectId; });
    if (idx === -1) return;

    var moved = fromArr.splice(idx, 1)[0];
    DATA[targetGrade].push(moved);

    saveData();
    renderSubjects(currentGrade);
  });

  renderFieldTabs();
  renderSubjects(currentGrade);
</script>
</body>
</html>
